:root{
  /* marca (Peak) */
  --top:linear-gradient(180deg,#34363B 0%,#26272B 55%,#1B1C1F 100%); /* fondo del encabezado: gris 85% con degradé */
  --cy:#1AB6F0; --cy-d:#0A9AD6; --cy-dd:#0A86C2; --cy-s:#E4F6FD; /* color de marca (botones, activo, datos): celeste */
  --azul:#0A7AF0; --bar:#1AB6F0; --bar-m:#8FD9F6; --bar-s:#DDF3FC;
  /* acento energía (Activity Hub) */
  --or:#F2844B; --or-d:#E0621F; --or-m:#F6B08C; --or-s:#FDE8DC; /* detalle: naranja */
  /* categorías por patrón (Peak) */
  --emp:#FF9500; --tra:#0A7AF0; --pie:#34C759; --cor:#FF2D55; --ski:#AF52DE; --tot:#1AB6F0;
  /* neutros */
  --bg:#F4F5F7; --card:#FFFFFF; --soft:#F0F1F4; --track:#DCDDE1; --ink:#1E2125; --ink2:#55595F; --ink3:#9A9EA5; --line:#E6E7EA;
  /* secuencial (mapa muscular) */
  --s1:#CDEFFC; --s2:#9EE0F8; --s3:#5ECDF3; --s4:#1AB6F0; --s5:#0A86C2;
  /* estado */
  --ok:#0CA30C; --warn:#FAB219; --crit:#D03B3B;
  --sh:0 1px 3px rgba(30,33,37,.08),0 6px 16px rgba(30,33,37,.05);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{max-width:480px;margin:0 auto;min-height:100vh;font-size:14px;line-height:1.35;font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0}

/* ===== encabezado celeste (Peak) ===== */
.top{position:sticky;top:0;z-index:20;background:var(--top);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.top .fila{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.titulo{font-size:17px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
.sync{margin-left:auto;white-space:nowrap;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;gap:6px;letter-spacing:.3px}
.sync b{width:7px;height:7px;border-radius:50%;background:#fff}
.sync.pend{background:#fff;color:var(--or-d)} .sync.pend b{background:var(--or)}
.sync.girando b{animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.2}}
.avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--cy-d);display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0}
.info{font-size:11px;color:rgba(255,255,255,.8);padding:0 16px 10px;font-weight:500}
.viendo{margin:0 16px 10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.viendo select{flex:1;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-weight:600}
.viendo select option{color:var(--ink);background:#fff;font-weight:500}
.viendo select optgroup{color:var(--cy-d);background:#F4F5F7;font-weight:800;font-style:normal}
.subtabs{display:flex;justify-content:space-around;background:transparent}
.subtabs button{flex:1;padding:12px 4px 11px;font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.92);border-bottom:3px solid transparent}
.subtabs button.on{color:#fff;border-bottom-color:#fff}

main{padding:6px 16px 100px}

/* ===== títulos de sección (Peak) ===== */
.sec{margin:22px 2px 2px;font-size:15px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#3A3D42;display:flex;align-items:baseline;gap:8px}
.sec .der{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;font-size:12px;color:var(--ink3)}
.sub{font-size:12px;color:var(--ink3);margin:4px 2px 12px;font-weight:500}
.grp{margin:20px 2px 8px;font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#3A3D42}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:16px}
.card+.card{margin-top:12px}

/* ===== barra Peak "juegos": etiqueta adentro, valor a la derecha ===== */
.pk-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.pk{position:relative;flex:1;height:38px;background:var(--track);overflow:hidden;display:flex;align-items:center;border-radius:2px;text-align:left}
.pk>i{position:absolute;left:0;top:0;bottom:0;border-radius:0}
.pk>i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.10) 14px 28px)}
.pk .pk-l{position:relative;padding-left:24px;color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}
.pk .pk-v{position:relative;margin-left:auto;padding-right:14px;color:#fff;font-weight:600;font-size:13px}
.pk.claro .pk-l{color:var(--ink);text-shadow:none}
.ib{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;flex-shrink:0;font-family:Georgia,serif;font-style:normal}

/* ===== barra Peak "cerebro": nombre + valor, barra fina con marcas ===== */
.br{padding:10px 0 6px}
.br-h{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:500;color:#2B2E33}
.br-h b{font-size:14px;font-weight:600;color:var(--ink3)}
.br-t{position:relative;height:14px;border-radius:99px;background:#E9EAED;margin-top:8px;overflow:hidden}
.br-t i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.br-t s{position:absolute;top:3px;bottom:3px;width:2px;background:rgba(255,255,255,.85);border-radius:2px}
.br-t s.g{background:#C9CBD0}

/* ===== puntaje (Peak Brain Score) ===== */
.score{font-size:24px;font-weight:700}.score small{font-size:14px;color:var(--ink3);font-weight:500}
.score-t{height:34px;border-radius:99px;border:2.5px solid #D4D6DA;padding:4px;margin-top:10px}
.score-t i{display:block;height:100%;border-radius:99px;background:var(--cy)}
.links{display:flex;justify-content:flex-end;gap:22px;margin-top:14px;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.links .a{color:#F5A623}

/* ===== Activity: hero naranja + tarjetas ===== */
.fecha-top{color:var(--ink3);font-size:15px;font-weight:500;margin:14px 2px 0}
.hola{font-size:32px;font-weight:700;letter-spacing:-.6px;margin:2px 2px 16px}
.hero{position:relative;overflow:hidden;background:var(--top);color:#fff;border-radius:28px;padding:22px 22px 20px;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.hero .v small{color:#AEB4BD}
.hero .l{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;opacity:.95}
.hero .v{font-size:58px;font-weight:800;letter-spacing:-2px;line-height:1;margin:14px 0 14px}
.hero .v small{font-size:20px;font-weight:600;letter-spacing:0}
.hero .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(26,182,240,.18);color:#8FDBFA;padding:7px 12px;border-radius:12px;font-size:13px;font-weight:600}
.hero .circ{position:absolute;right:20px;top:22px;width:84px;height:84px;border-radius:50%;background:rgba(26,182,240,.16);display:grid;place-items:center}
.hero .meter{height:6px;border-radius:99px;background:rgba(255,255,255,.14);margin:0 0 14px;overflow:hidden;width:62%}
.hero .meter i{display:block;height:100%;background:var(--cy);border-radius:99px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.mc{background:#ECEDF0;border-radius:24px;padding:16px}
.mc .ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:14px}
.mc .v{font-size:30px;font-weight:800;letter-spacing:-.8px}
.mc .v small{font-size:14px;font-weight:600;color:var(--ink2);letter-spacing:0}
.mc .l{font-size:13px;font-weight:600;color:#3A3D42}
.mc .d{font-size:12px;color:var(--ink3);margin-top:2px}
.up{font-weight:700}.down{font-weight:700}

/* ===== botones ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase;background:var(--cy);color:#fff}
.btn:active{transform:scale(.98)}
.btn.out{background:transparent;color:var(--cy-d);box-shadow:inset 0 0 0 2px var(--cy)}
.btn.blanco{background:#fff;color:var(--or-d)}
.btn.gris{background:var(--soft);color:var(--ink2)}
.btn.mini{width:auto;padding:9px 14px;font-size:11px}
.fila2{display:flex;gap:10px;flex-wrap:wrap}.fila2>.btn{flex:1;min-width:calc(50% - 5px);padding:12px 10px;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:4px 10px;border-radius:99px;font-weight:600;white-space:nowrap;color:#fff}
.seg{display:flex;background:#ECEDF0;border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:99px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* ===== rutina ===== */
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--cy-d)}
.rut-n{font-size:21px;font-weight:700;letter-spacing:-.3px;margin-top:2px}
.lista-ej{margin:12px 0 16px;padding:0;list-style:none}
.lista-ej li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lista-ej .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.lista-ej .o{margin-left:auto;font-weight:700;font-size:15px}
.lista-ej .u{font-size:12px;color:var(--ink3)}
.alerta{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--sh);border-left:5px solid var(--cor);width:100%;text-align:left}
.alerta b{color:var(--cor)}
.alerta.info{border-left-color:var(--cy)} .alerta.info b{color:var(--cy-d)}

/* ===== sesión activa ===== */
.cron{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;background:var(--top);color:#fff;border-radius:24px;padding:16px 18px;margin-top:12px;box-shadow:0 10px 24px rgba(14,165,228,.25)}
.cron .t{font-size:34px;font-weight:800;letter-spacing:-1px}
.cron .x{margin-left:auto;text-align:right;font-size:12px;font-weight:600}
.ej{background:var(--card);border-radius:14px;box-shadow:var(--sh);margin-top:12px;overflow:hidden;border-left:5px solid var(--c,var(--cy))}
.ej-h{padding:13px 14px;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left}
.ej-h h4{font-size:15px;font-weight:700}
.ej-h .meta{font-size:12px;color:var(--ink3);margin-top:3px}
.ej-h .meta b{color:var(--ink2);font-weight:700}
.estado-ej{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink3);white-space:nowrap}
.estado-ej.ok{color:var(--ok)}
.ej-b{padding:0 14px 14px}
.series{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.serie{min-width:54px;padding:7px 8px;border-radius:10px;background:var(--c-s,var(--cy-s));color:var(--ink);font-weight:700;text-align:center;font-size:15px}
.serie small{display:block;font-size:10px;font-weight:600;color:var(--ink3)}
.serie.rec{background:var(--cy);color:#fff}.serie.rec small{color:rgba(255,255,255,.85)}
.serie.vacia{background:var(--soft);color:var(--ink3);font-weight:600}
.carga{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;background:var(--soft);border-radius:99px}
.stepper button{width:40px;height:46px;font-size:22px;font-weight:600;color:var(--cy-d)}
.stepper input{width:44px;text-align:center;border:0;background:none;font-size:20px;font-weight:800;padding:0}
.stepper .u{font-size:11px;color:var(--ink3);margin-right:4px}
.kg{width:62px;border:0;background:var(--soft);border-radius:99px;height:46px;text-align:center;font-weight:700}
.carga .btn{flex:1;padding:14px 10px}
.rpe{display:flex;gap:6px;margin-top:10px;align-items:center;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.rpe button{padding:6px 11px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:600;color:var(--ink2)}
.rpe button.on{background:var(--ink);color:#fff}
.descanso{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;width:calc(100% - 32px);max-width:448px;background:var(--cy);color:#fff;border-radius:99px;padding:11px 18px;display:flex;align-items:center;gap:12px;font-weight:700;z-index:30;box-shadow:0 8px 24px rgba(10,134,194,.35)}
.descanso .bar{flex:1;height:6px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.descanso .bar i{display:block;height:100%;background:#fff}

/* ===== gráficos ===== */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--ink3);font-family:inherit;font-weight:500}
.chart .lbl{fill:var(--ink);font-weight:700;font-size:11px}
.chart .xact{fill:var(--ink);font-weight:700}
.tt{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;z-index:90;display:none;white-space:nowrap;font-weight:500}
.tt b{color:#7FDBFF}
select.sel{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rec{background:var(--soft);border-radius:12px;padding:10px}
.rec .l{font-size:11px;color:var(--ink3);font-weight:600}
.rec .v{font-size:19px;font-weight:800}
.rec .f{font-size:10px;color:var(--ink3)}
.prog{display:flex;align-items:flex-start;margin-top:8px}
.prog .paso{flex:1;text-align:center;font-size:11px;color:var(--ink3);position:relative;font-weight:500}
.prog .paso i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 6px;background:#E3E5E9;border:3px solid var(--card);box-shadow:0 0 0 1.5px #E3E5E9;position:relative;z-index:1}
.prog .paso.hecho i{background:var(--cy);box-shadow:0 0 0 1.5px var(--cy)}
.prog .paso.actual i{background:var(--or);box-shadow:0 0 0 2px var(--or)}
.prog .paso.actual{color:var(--ink);font-weight:700}
.prog .paso:not(:last-child)::after{content:"";position:absolute;top:11px;left:50%;width:100%;height:2px;background:#E3E5E9}
.prog .paso.hecho:not(:last-child)::after{background:var(--cy)}
.ley{display:flex;gap:14px;font-size:11px;color:var(--ink3);font-weight:600;margin-top:8px;justify-content:center}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ===== músculos ===== */
.cuerpos{display:flex;gap:6px;justify-content:center}
.cuerpos figure{margin:0;text-align:center;flex:1}
.cuerpos figcaption{font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.cuerpo{width:100%;max-width:180px;height:auto}
.cuerpo .base{fill:#E3E5E9}
.cuerpo .m{cursor:pointer;transition:opacity .12s}
.cuerpo .m:hover{opacity:.78}
.cuerpo .m.sel{stroke:#1E2125;stroke-width:2.5;vector-effect:non-scaling-stroke}
.cuerpo.mini .m{cursor:default}.cuerpo.mini .m:hover{opacity:1}
.minimapa{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:8px 10px;margin:4px 0 12px}
.minimapa .cuerpo{width:52px;flex-shrink:0}
.mm-ley{flex:1;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink2);font-weight:500;margin-left:6px}
.mm-ley i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ejm{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.ejm .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ejm b{font-weight:600;display:block}.ejm small{font-size:11px;color:var(--ink3)}
.scx{overflow-x:auto;margin-top:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scx::-webkit-scrollbar{display:none}
.scx svg{display:block}
.desliz{display:flex;align-items:center;gap:12px;margin-top:6px}
.desliz span{font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;min-width:92px}
.desliz input{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:#E3E5E9;outline:none}
.desliz input::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:22px;border-radius:99px;background:var(--cy);box-shadow:0 2px 6px rgba(10,134,194,.35);cursor:grab}
.desliz input::-moz-range-thumb{width:44px;height:22px;border:0;border-radius:99px;background:var(--cy);cursor:grab}
.leyenda{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);justify-content:center;margin-top:10px;font-weight:500}
.leyenda{flex-wrap:wrap}.leyenda .esc{display:flex;gap:2px}.leyenda .esc i{width:20px;height:8px;border-radius:2px}
.est{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;margin-left:auto}
.est i{width:8px;height:8px;border-radius:50%}
.est.ok i{background:var(--ok)}.est.aten i{background:var(--warn)}.est.desc i,.est.sin i{background:var(--crit)}
.est.ok{color:#0A7A0A}.est.aten{color:#8A5D00}.est.desc,.est.sin{color:var(--crit)}
.nota{font-size:12px;color:var(--ink2);margin-top:16px;line-height:1.5}

/* ===== historial ===== */
.ses{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px 14px;margin-top:8px;width:100%;text-align:left}
.ses .fecha{width:44px;text-align:center;flex-shrink:0;border-right:1px solid var(--line);padding-right:10px}
.ses .fecha b{display:block;font-size:22px;font-weight:700;line-height:1}
.ses .fecha small{font-size:10px;color:var(--ink3);text-transform:uppercase;font-weight:700;letter-spacing:.5px}
.ses .c{flex:1;min-width:0}
.ses h4{font-size:15px;font-weight:700;margin-bottom:2px}
.ses .r{font-size:12px;color:var(--ink3)}
.vacio{text-align:center;color:var(--ink3);padding:30px 10px}

/* ===== barra inferior (Peak) ===== */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#ECEDF0;border-top:1px solid #DFE0E4;display:flex;padding:0 0 env(safe-area-inset-bottom);z-index:25;height:64px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#9AA0A6}
nav.tabs svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button span{display:none}
nav.tabs button.on{background:#fff;color:var(--cy)}
nav.tabs button.on span{display:block}

/* ===== hojas / modales ===== */
.velo{position:fixed;inset:0;background:rgba(30,33,37,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:8px 16px 24px}
.hoja .asa{width:40px;height:5px;border-radius:99px;background:#CDD0D5;margin:4px auto 14px}
.hoja h3{font-size:21px;font-weight:700}
.buscar{width:100%;padding:12px 16px;border-radius:99px;border:0;background:#fff;margin:12px 0;box-shadow:var(--sh)}
.opc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;background:var(--card);border-radius:12px;margin-top:6px;font-weight:600}
.opc .u{margin-left:auto;font-size:11px;font-weight:600;color:#fff;padding:3px 8px;border-radius:99px}
textarea.notas{width:100%;border:0;border-radius:14px;padding:12px;min-height:70px;background:var(--card);box-shadow:var(--sh)}
.sens{display:flex;gap:8px;margin:10px 0 12px}
.sens button{flex:1;padding:10px 0;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.sens button b{font-size:20px}
.sens button.on{background:var(--cy);color:#fff}.sens button.on div{color:#fff!important}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kp div{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.kp .l{font-size:12px;color:var(--ink3);font-weight:600}.kp .v{font-size:26px;font-weight:800}.kp .v small{font-size:13px;color:var(--ink3)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:600;font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}

/* ===== ingreso ===== */
.login-top{background:var(--top);color:#fff;padding:44px 22px 26px}
.login-top .marca{font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.login-top p{color:rgba(255,255,255,.9);margin:12px 0 0;font-size:14px}
.login-top .demo{display:inline-block;background:#fff;color:var(--cy-d);font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:99px;vertical-align:middle}
.login-body{padding:4px 16px 30px}
.perfil{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:#fff;margin-top:8px;box-shadow:var(--sh);font-weight:600}
.perfil .avatar{width:38px;height:38px;color:#fff}
.perfil small{display:block;color:var(--ink3);font-size:12px;font-weight:500}
.perfil .flecha{margin-left:auto;color:var(--cy);font-size:20px}
.pass{margin-top:14px;display:flex;gap:8px}
.pass input{flex:1;padding:13px 16px;border-radius:99px;border:0;background:#fff;box-shadow:var(--sh)}

/* ===== v0.0.5: rutinas, clase, calendario, inicio alumno ===== */
.hero .tagc{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);color:#D5DADF;margin-right:6px}
.hero .tagc.ok{background:rgba(12,163,12,.22);color:#8BE58B}.hero .tagc.pend{background:rgba(242,132,75,.22);color:#FFC29F}.hero .tagc.susp{background:rgba(255,255,255,.1);color:#AEB4BD}
.hero .acciones{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;padding-right:80px}
.btn.osc{background:rgba(255,255,255,.1);color:#fff}
.navc{display:flex;align-items:center;gap:8px;margin:12px 0}
.navc button{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:18px;font-weight:700;color:var(--ink2)}
.navc button:disabled{opacity:.35}
.navc .t{flex:1;text-align:center;font-weight:700;font-size:14px}
.alu-row{background:#fff;border-radius:14px;box-shadow:var(--sh);margin-top:8px;overflow:hidden}
.alu-h{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;text-align:left}
.chk{width:34px;height:34px;border-radius:50%;border:2.5px solid #CDD2D8;display:grid;place-items:center;flex-shrink:0;color:transparent;font-weight:800;font-size:16px;transition:all .12s}
.chk.on{background:var(--cy);border-color:var(--cy);color:#fff}
.alu-h .c{flex:1;min-width:0}.alu-h b{display:block;font-weight:600}.alu-h small{font-size:12px;color:var(--ink3)}

<script>/* App instalada (PWA): los datos viven en este dispositivo (IndexedDB). Se leen antes de arrancar la app
   y se guardan unos instantes después de cada cambio (y al pasar a segundo plano). */
(function () {
  window.APP_MODO = 'local';
  var NOMBRE = 'madebe-integral', TABLA = 'datos', CLAVE = 'estado', dbp = null, pendiente = null, timer = null, esperando = [];

    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      var r = indexedDB.open(NOMBRE, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(TABLA); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    });
    return dbp;

      const suspendida = U.sumDias(U.lunes(hoy), -17);
      for (let f = DESDE; f <= HASTA; f = U.sumDias(f, 1)) {
        if (!g.dias.includes(U.dia(f).getDay())) continue;
        const id = g.id + '-' + f;
        const susp = f >= suspendida && f < U.sumDias(suspendida, 7) && n++ === 0 && f < hoy;
        const rut = g.secuencia[iRot % g.secuencia.length];
        if (susp) { cla.push({ id, g: g.id, f, h: g.hora, rut, est: 'susp', nota: 'Lluvia', mod: f + 'T00:00', sync: 'ok' }); log.push({ id: 'L' + id + '-s', ts: f + 'T18:00', actor: g.profesor, tipo: 'suspension', clase: id, txt: 'Clase suspendida por lluvia; el plan se corrió una clase', mod: f, sync: 'ok' }); continue; }
        iRot++;
        const est = f < hoy ? 'hecha' : 'plan';
        cla.push({ id, g: g.id, f, h: g.hora, rut, est, mod: f + 'T00:00', sync: 'ok' });
        if (est !== 'hecha') continue;
        const t = 1 - U.difDias(hoy, f) / 91;
        let pres = 0;
        g.alumnos.forEach(a => {
          const p = window.DEMO_PERFILES[a] || { asiste: .8, faltaPiernas: 0, inactivoDias: 0, progreso: .3 };
          const ra = rng(a + f);
          let estado = 'presente', rutA = rut, motivo = '';
          if (U.difDias(hoy, f) <= p.inactivoDias || ra() > p.asiste) estado = ra() < 0.35 ? 'justificado' : 'ausente';
          else if (rut === 'R4' && ra() < p.faltaPiernas) { if (ra() < 0.5) { rutA = 'R2'; motivo = 'Molestia o lesión'; } else estado = 'ausente'; }
          else if (ultimaFalta[a] && ultimaFalta[a] !== rut && ra() < 0.5) { rutA = ultimaFalta[a]; motivo = 'Faltó a la clase anterior'; }
          asi.push({ id: id + '|' + a, clase: id, g: g.id, u: a, f, estado, rutPlan: rut, rut: estado === 'presente' ? rutA : '', motivo: estado === 'justificado' ? 'Avisó que no podía venir' : motivo, por: g.profesor, mod: f + 'T' + g.hora, sync: 'ok' });
          if (estado !== 'presente') { ultimaFalta[a] = rut; return; }
          delete ultimaFalta[a]; pres++;
          if (rutA !== rut) log.push({ id: 'L' + id + '-' + a, ts: f + 'T' + g.hora, actor: g.profesor, tipo: 'rutina_alumno', clase: id, u: a, de: rut, a: rutA, motivo, mod: f, sync: 'ok' });
          const sid = 'c-' + id + '-' + a, R = C.rut[rutA];
          ses.push({ id: sid, clase: id, u: a, f, ini: g.hora, rutPlan: rut, rut: rutA, rutNombre: R.nombre, motivo, items: snapItems(R), por: g.profesor, mod: f + 'T' + g.hora, bor: 0, sync: 'ok' });
          R.items.forEach(it => {
            const pl = planAlumno(a, it, f, NIV0), e = C.ej[pl.ej], esc = (1 - p.progreso) + p.progreso * t;
            for (let k = 1; k <= it.series; k++) {
              let v, origen = pl.origen;
              if (pl.tipo === 'fallo') v = Math.max(1, Math.round((FALLO_BASE[pl.ej] || 8) * (0.7 + 0.45 * t) - (k - 1) * 1.5 + (ra() - .5) * 2.5));
              else if (pl.tipo === 'rango') v = Math.round(pl.obj + (pl.max - pl.obj) * t);
              else { v = pl.obj; if (ra() < 0.08) { v = Math.max(1, Math.round(pl.obj * esc)); if (v !== pl.obj) origen = 'dia'; } }
              if (e.medida === 'tiempo' || pl.tipo === 'tiempo') v = Math.max(5, Math.round(v / 5) * 5);
              const rpe = Math.max(5, Math.min(10, (pl.rpe || 7) + Math.round((ra() - .5) * 2)));
              ser.push({ id: sid + '-' + it.orden + '-' + k, s: sid, u: a, f, orden: it.orden, n: k, base: it.ej, ej: pl.ej, modf: pl.modf, tipo: pl.tipo, obj: pl.obj, max: pl.max, cargaObj: pl.carga, rpeObj: pl.rpe, origen, reps: e.medida === 'reps' ? v : 0, seg: e.medida === 'tiempo' ? v : 0, kg: pl.carga, rpe, mod: f, bor: 0 });
            }
          });
        });
        cla[cla.length - 1].snap = { nombre: C.rut[rut].nombre, items: snapItems(C.rut[rut]) };
        log.push({ id: 'L' + id + '-a', ts: f + 'T' + g.hora, actor: g.profesor, tipo: 'asistencia', clase: id, txt: `Asistencia tomada: ${pres} de ${g.alumnos.length} presentes`, mod: f, sync: 'ok' });
      }
    });
    // la última clase de Carla (G1) todavía no tiene la asistencia tomada
    const pend = cla.filter(c => c.g === 'G1' && c.est === 'hecha').pop();
    if (pend) {
      pend.est = 'plan'; delete pend.snap; const ids = new Set(ses.filter(x => x.clase === pend.id).map(x => x.id));
      return { cla, ses: ses.filter(x => !ids.has(x.id)), ser: ser.filter(x => !ids.has(x.s)), asi: asi.filter(x => x.clase !== pend.id), log: log.filter(x => x.clase !== pend.id) };
    }
    return { cla, ses, ser, asi, log };
  }

  /* ---------- almacenamiento local (v0.1 real: IndexedDB + GitHub) ---------- */
  /* MODO 'demo' = HTML de prueba (localStorage). MODO 'local' = app instalada (PWA): todo se guarda en este dispositivo con IndexedDB */
  const MODO = window.APP_MODO || 'demo';
  const KEY = MODO === 'local' ? 'madebe_local_v1' : 'calistenia_demo_v9';
  const COLS = ['ses', 'ser', 'cla', 'rut', 'ejn', 'ejv', 'grp', 'usr', 'niv', 'asi', 'log', 'seq', 'pts'];
  function vacio() { const o = { meta: {} }; COLS.forEach(c => o[c] = []); return o; }
  function normal(x) { const o = Object.assign(vacio(), x || {}); COLS.forEach(c => { if (!Array.isArray(o[c])) o[c] = []; }); if (!o.meta || typeof o.meta !== 'object') o.meta = {}; return o; }
  function leerLocal() {
    if (MODO === 'local' && window.__IDB) return normal(window.__IDB.inicial);

  }
  function guardarLocal(x) {
    if (MODO === 'local' && window.__IDB) return window.__IDB.guardar(x);

    return Promise.resolve();
  }

  const DB = { local: leerLocal(), nivHist: [], MODO };
  DB.planAlumno = (u, it, f) => planAlumno(u, it, f);
  DB.nivelVigente = (u, base, f) => nivelVigente(u, base, f || U.hoy());
  function mezclar(base, loc) { const m = new Map(); base.forEach(x => m.set(x.id, x)); loc.forEach(x => { const a = m.get(x.id); if (!a || (x.mod || '') >= (a.mod || '')) m.set(x.id, x); }); return [...m.values()]; }
  DB.reidx = () => C.reindex(DB.local.ejn, DB.local.rut, seqLocal(), DB.local.ejv, DB.local.grp, DB.local.usr);
  const seqLocal = () => { const o = {}; DB.local.seq.forEach(x => o[x.id] = x.secuencia); return o; };
  DB.cargar = function () {
    C.reindex();
    if (MODO === 'local' && !DB.local.meta.ref) { DB.local.meta.ref = U.hoy(); DB.local.meta.instalada = new Date().toISOString(); guardarLocal(DB.local); }
    const sinDemo = !!DB.local.meta.sinDemo;
    const d = sinDemo ? { cla: [], ses: [], ser: [], asi: [], log: [] } : generarDemo(DB.local.meta.ref); // la historia se genera con el catálogo original
    DB.reidx();
    DB.ses = mezclar(d.ses, DB.local.ses).sort((a, b) => (a.f + a.ini).localeCompare(b.f + b.ini));
    DB.ser = mezclar(d.ser, DB.local.ser);
    DB.cla = mezclar(d.cla, DB.local.cla).filter(c => !c.bor).sort(DB.ordenClase);
    DB.asi = mezclar(d.asi, DB.local.asi);
    DB.log = mezclar(d.log, DB.local.log).sort((a, b) => b.ts.localeCompare(a.ts));
    DB.nivHist = mezclar(sinDemo ? [] : NIV0, DB.local.niv).sort((a, b) => a.desde.localeCompare(b.desde));
    DB.pts = DB.local.pts.slice();
    DB.indexar();
    DB.extenderPlan();
  };
  /* el calendario siempre tiene planificadas las próximas 8 semanas de cada clase activa (continúa la rotación de rutinas) */
  DB.extenderPlan = function (dias) {
    const hoy = U.hoy(), fin = U.sumDias(hoy, dias || 56), ids = new Set(DB.local.cla.map(c => c.id)); let n = 0;
    C.GRUPOS.filter(g => g.activo !== false && g.dias.length && g.secuencia.length).forEach(g => {
      const cl = DB.clasesGrupo(g.id), ult = cl.length ? cl[cl.length - 1] : null;
      let i = ult && g.secuencia.includes(ult.rut) ? g.secuencia.indexOf(ult.rut) + 1 : 0;
      let f = ult && ult.f >= hoy ? U.sumDias(ult.f, 1) : hoy;
      for (; f <= fin; f = U.sumDias(f, 1)) {
        if (!g.dias.includes(U.dia(f).getDay())) continue;
        const id = g.id + '-' + f; if (ids.has(id) || DB.cla.some(c => c.id === id)) continue;
        if (DB.clasesDia(g.id, f).some(c => DB.hora(c) === g.hora)) continue;
        DB.upsert('cla', { id, g: g.id, f, h: g.hora, rut: g.secuencia[i % g.secuencia.length], est: 'plan' }, true); i++; n++;
      }
    });
    if (n) DB.guardar();
    return n;
  };
  DB.indexar = function () {
    DB.serPorSes = {};
    DB.ser.forEach(x => { if (x.bor) return; (DB.serPorSes[x.s] = DB.serPorSes[x.s] || []).push(x); });
    Object.values(DB.serPorSes).forEach(a => a.sort((p, q) => (p.orden || 0) - (q.orden || 0) || p.n - q.n));
    DB.sesPorClase = {}; DB.ses.forEach(s => { if (!s.bor && s.clase) (DB.sesPorClase[s.clase] = DB.sesPorClase[s.clase] || []).push(s); });
    DB.asiPorClase = {}; DB.asi.forEach(x => { if (!x.bor) (DB.asiPorClase[x.clase] = DB.asiPorClase[x.clase] || {})[x.u] = x; });
  };
  DB.upsert = function (tipo, obj, silencioso) {
    obj.mod = new Date().toISOString(); obj.sync = 'pend';
    const loc = DB.local[tipo]; const i = loc.findIndex(x => x.id === obj.id);
    if (i >= 0) loc[i] = obj; else loc.push(obj);
    if (tipo === 'niv') { const j = DB.nivHist.findIndex(x => x.id === obj.id); if (j >= 0) DB.nivHist[j] = obj; else DB.nivHist.push(obj); DB.nivHist.sort((a, b) => a.desde.localeCompare(b.desde)); }
    else if (tipo === 'pts') { const j = DB.pts.findIndex(x => x.id === obj.id); if (j >= 0) DB.pts[j] = obj; else DB.pts.push(obj); }
    else if (['rut', 'ejn', 'ejv', 'seq', 'grp', 'usr'].includes(tipo)) DB.reidx();
    else { const arr = DB[tipo]; const j = arr.findIndex(x => x.id === obj.id); if (j >= 0) arr[j] = obj; else arr.push(obj); if (tipo === 'cla') { if (obj.bor) DB.cla.splice(DB.cla.indexOf(obj), 1); DB.cla.sort(DB.ordenClase); } if (tipo === 'log') DB.log.sort((a, b) => b.ts.localeCompare(a.ts)); }
    if (!silencioso) { guardarLocal(DB.local); DB.indexar(); }
  };
  DB.guardar = () => { guardarLocal(DB.local); DB.indexar(); };
  DB.pendientes = () => COLS.reduce((a, c) => a + DB.local[c].filter(x => x.sync === 'pend').length, 0);
  DB.ultimaSync = (() => { try { return localStorage.getItem(KEY + '_sync') || ''; } catch (e) { return ''; } })();
  DB.sincronizar = function () { // simulación: en la versión real sube registros/<usuario>/<AAAA-MM>.json cifrado
    return new Promise(res => setTimeout(() => {
      COLS.forEach(c => DB.local[c].forEach(x => x.sync = 'ok'));
      ['ses', 'cla', 'asi', 'log'].forEach(c => DB[c].forEach(x => { if (x.sync === 'pend') x.sync = 'ok'; }));
      const d = new Date(); DB.ultimaSync = pad(d.getHours()) + ':' + pad(d.getMinutes());
      try { localStorage.setItem(KEY + '_sync', DB.ultimaSync); } catch (e) { }
      guardarLocal(DB.local); res();
    }, 900));
  };
  DB.reiniciarDemo = function () { const ult = DB.local.meta.ultimaCopia; DB.local = vacio(); if (ult) DB.local.meta.ultimaCopia = ult; const p = guardarLocal(DB.local); DB.cargar(); return p; };
  /* empezar con alumnos reales: quita los alumnos de prueba, su historia y sus niveles; quedan ejercicios, rutinas y clases (sin alumnos) */
  DB.quitarDemo = function (actor) {
    const demo = new Set(BASE.USR.filter(u => u.rol === 'alumno').map(u => u.usuario));
    const L = DB.local;
    L.meta.sinDemo = true; L.meta.sinDemoDesde = U.hoy();
    L.ses = L.ses.filter(x => !demo.has(x.u)); L.ser = L.ser.filter(x => !demo.has(x.u)); L.asi = L.asi.filter(x => !demo.has(x.u)); L.niv = L.niv.filter(x => !demo.has(x.u)); L.pts = []; L.log = [];
    const conAsi = new Set(L.asi.map(x => x.clase));

    L.usr = L.usr.filter(u => !demo.has(u.usuario)).concat(BASE.USR.filter(u => demo.has(u.usuario)).map(u => Object.assign({}, u, { bor: true })));
    C.reindex(L.ejn, L.rut, seqLocal(), L.ejv, L.grp, L.usr);
    const grp = new Map(L.grp.map(g => [g.id, g]));
    C.GRUPOS.forEach(g => { const keep = g.alumnos.filter(a => !demo.has(a)); if (keep.length !== g.alumnos.length || !grp.has(g.id)) grp.set(g.id, Object.assign(JSON.parse(JSON.stringify(g)), { alumnos: keep })); });

  /* copia de seguridad: todo lo cargado en este dispositivo en un archivo JSON */
  DB.copia = () => ({ app: 'madebe-integral', formato: 1, version: window.APP_VERSION, fecha: new Date().toISOString(), datos: DB.local });
  DB.marcarCopia = () => { DB.local.meta.ultimaCopia = new Date().toISOString(); return guardarLocal(DB.local); };
  DB.validarCopia = o => !!(o && o.app === 'madebe-integral' && o.datos && typeof o.datos === 'object' && COLS.every(c => o.datos[c] === undefined || Array.isArray(o.datos[c])));
  DB.restaurar = function (o) { const ult = new Date().toISOString(); DB.local = normal(o.datos); DB.local.meta.ultimaCopia = DB.local.meta.ultimaCopia || ult; DB.local.meta.restaurada = ult; return guardarLocal(DB.local); };
  DB.diasSinCopia = () => { const u = DB.local.meta.ultimaCopia || DB.local.meta.instalada; return u ? Math.floor((Date.now() - new Date(u)) / 864e5) : 0; };
  DB.cambiosDesdeCopia = () => { const u = DB.local.meta.ultimaCopia || ''; return COLS.reduce((a, c) => a + DB.local[c].filter(x => (x.mod || '') > u).length, 0); };

  /* ---------- alumnos y clases (grupos) ---------- */
  const DN = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  DB.nombreDias = dias => { const xs = dias.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DN[d]); return xs.length > 1 ? xs.slice(0, -1).join(', ') + ' y ' + xs[xs.length - 1] : xs[0] || ''; };
  DB.nombreHora = h => h.endsWith(':00') ? String(+h.slice(0, 2)) + ' h' : String(+h.slice(0, 2)) + h.slice(2) + ' h';
  DB.nombreGrupo = g => (g.tipo === 'especial' ? 'Especial · ' : g.tipo === 'personal' ? 'Personal · ' + ((C.usr[g.alumnos[0]] || {}).nombre || '').split(' ')[0] + ' · ' : '') + DB.nombreDias(g.dias) + ' ' + DB.nombreHora(g.hora);
  DB.guardarAlumno = function (u, actor) {
    const nuevo = !C.usr[u.usuario]; const base = Object.assign({ rol: 'alumno', activo: true, ranking: false, profesor: (C.USUARIOS.find(x => x.rol === 'profesor' && x.activo) || {}).usuario || actor }, C.usr[u.usuario] ? JSON.parse(JSON.stringify(C.usr[u.usuario])) : {}, u);

  DB.idUsuario = nombre => { const b = nombre.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]+/g, '').slice(0, 10) || 'alumno'; let id = b, i = 2; while (C.usr[id]) id = b + i++; return id; };
  /* mover un alumno a otro grupo habitual (o a ninguno): cambia las listas, no lo ya registrado */
  DB.asignarHabitual = function (u, gid, actor) {
    const ant = C.GRUPOS.find(g => g.tipo === 'habitual' && g.alumnos.includes(u));
    if ((ant && ant.id) === (gid || undefined) || (!ant && !gid)) return false;
    if (ant) DB.upsert('grp', Object.assign(JSON.parse(JSON.stringify(ant)), { alumnos: ant.alumnos.filter(a => a !== u) }), true);

  /* crear o editar una clase recurrente. Si cambian días u horario se regeneran las clases futuras sin asistencia (lo ya dado no cambia) */
  DB.guardarGrupo = function (g, actor, HASTA_DIAS) {
    const prev = C.grp[g.id] ? JSON.parse(JSON.stringify(C.grp[g.id])) : null, hoy = U.hoy();
    g = Object.assign({ tipo: 'habitual', activo: true, alumnos: [], profesor: actor }, prev || {}, g);
    if (g.tipo === 'especial') g.alumnos = [];
    // un alumno tiene una sola clase habitual: si lo sumo acá, sale de la anterior
    if (g.tipo === 'habitual') C.GRUPOS.filter(x => x.id !== g.id && x.tipo === 'habitual' && x.alumnos.some(a => g.alumnos.includes(a))).forEach(x => DB.upsert('grp', Object.assign(JSON.parse(JSON.stringify(x)), { alumnos: x.alumnos.filter(a => !g.alumnos.includes(a)) }), true));
    if (!g.nombreFijo) g.nombre = DB.nombreGrupo(g);
    ['nombreAuto'].forEach(k => delete g[k]);
    if (g.secuencia && g.secuencia.length) DB.upsert('seq', { id: g.id, secuencia: g.secuencia.slice() }, true);
    DB.upsert('grp', g, true); DB.reidx();
    const agenda = !prev || prev.hora !== g.hora || JSON.stringify(prev.dias.slice().sort()) !== JSON.stringify(g.dias.slice().sort()) || prev.activo !== g.activo;
    let nuevas = 0;
    if (agenda) {
      DB.clasesGrupo(g.id).filter(c => c.est === 'plan' && c.f >= hoy && !c.extra && !DB.asiPorClase[c.id]).forEach(c => DB.upsert('cla', Object.assign(c, { bor: true }), true));
      if (g.activo) for (let f = hoy, fin = U.sumDias(hoy, HASTA_DIAS || 56); f <= fin; f = U.sumDias(f, 1)) {
        if (!g.dias.includes(U.dia(f).getDay())) continue;
        const id = g.id + '-' + f; if (DB.cla.some(c => c.id === id)) continue;
        if (DB.clasesDia(g.id, f).length >= DB.MAX_DIA || DB.clasesDia(g.id, f).some(c => DB.hora(c) === g.hora)) continue;
        DB.upsert('cla', { id, g: g.id, f, h: g.hora, rut: g.secuencia[0] || '', est: 'plan' }, true); nuevas++;
      }
      DB.indexar(); DB.replanificar(g.id, hoy);
    }
    const tipoTxt = { habitual: 'Clase', personal: 'Clase personalizada', especial: 'Clase especial' }[g.tipo];
    DB.registrar(actor, prev ? 'grupo' : 'grupo_alta', { g: g.id, txt: prev ? `${tipoTxt} ${g.nombre} actualizada${agenda ? ` · días u horario nuevos desde el ${hoy} (${nuevas} clases planificadas)` : ''}` : `${tipoTxt} creada: ${g.nombre} (${nuevas} clases planificadas)` });
    DB.guardar(); return g;
  };

  /* ---------- editar un ejercicio ya establecido: nueva versión desde hoy ---------- */
  DB.editarEjercicio = function (id, campos, actor) {
    const e = C.ej[id]; if (!e) return false;
    const NOM = { nombre: 'nombre', patron: 'patrón', medida: 'unidad', principal: 'músculo principal', secundarios: 'secundarios', lastre: 'lastre' };
    const txt = (k, v) => k === 'principal' ? (C.mus[v] || {}).nombre : k === 'secundarios' ? (v.map(m => (C.mus[m] || {}).nombre).join(', ') || 'ninguno') : k === 'medida' ? (v === 'tiempo' ? 'segundos' : 'repeticiones') : k === 'lastre' ? (v ? 'sí' : 'no') : v;
    const cambios = CAMPOS_EJ.filter(k => JSON.stringify(campos[k]) !== JSON.stringify(e[k]));
    if (!cambios.length) return false;
    const v = { id: 'v' + U.uid(), ej: id, desde: U.hoy(), ts: new Date().toISOString(), por: actor, campos: CAMPOS_EJ.reduce((o, k) => (o[k] = Array.isArray(campos[k]) ? campos[k].slice() : campos[k], o), {}) };
    DB.registrar(actor, 'ejercicio_editado', { ej: id, txt: `Ejercicio editado: ${e.nombre}${campos.nombre !== e.nombre ? ' → ' + campos.nombre : ''} (vale desde el ${v.desde})`, detalle: cambios.map(k => ({ nombre: NOM[k], antes: txt(k, e[k]), despues: txt(k, campos[k]) })) });

  };

  /* ---------- auditoría (solo se agregan registros) ---------- */
  DB.registrar = function (actor, tipo, datos) { DB.upsert('log', Object.assign({ id: 'L' + U.uid(), ts: new Date().toISOString(), actor, tipo }, datos), true); };
  DB.logClase = id => DB.log.filter(x => x.clase === id);

  /* ---------- calendario ---------- */
  /* hasta 4 clases por día y grupo, cada una con su horario (h = 'HH:MM'); el orden del plan es fecha + hora */
  DB.MAX_DIA = 4;

  DB.clave = c => c.f + ' ' + DB.hora(c);
  DB.ordenClase = (a, b) => DB.clave(a).localeCompare(DB.clave(b));
  DB.clasesGrupo = g => DB.cla.filter(c => c.g === g);
  /* alumnos de una clase: especial = abierta a todos; ya tomada = los que tienen registro (lo generado no cambia) + los actuales del grupo */
  DB.alumnosClase = function (c) {

    if (g.tipo === 'especial') return act.sort((a, b) => C.usr[a].nombre.localeCompare(C.usr[b].nombre));
    const reg = c.est === 'hecha' ? Object.keys(DB.asiPorClase[c.id] || {}) : [];
    return [...new Set(reg.concat(c.est === 'hecha' ? [] : g.alumnos.filter(a => C.usr[a] && C.usr[a].activo)))];
  };
  DB.clasesDia = (g, f) => DB.clasesGrupo(g).filter(c => c.f === f);
  DB.agregarClase = function (g, f, h, rut, actor) {

    DB.upsert('cla', c, true);
    DB.registrar(actor, 'agregar_clase', { clase: c.id, a: rut, txt: `Clase agregada el ${f} a las ${h} con ${(C.rut[rut] || {}).nombre || rut}; se suma a la rotación del grupo` });

  };
  DB.quitarClase = function (id, actor) {

    DB.registrar(actor, 'quitar_clase', { clase: id, txt: `Clase del ${c.f} ${DB.hora(c)} quitada del calendario (${(C.rut[c.rut] || {}).nombre || c.rut})` });
    DB.upsert('cla', Object.assign(c, { bor: true }), true); DB.guardar(); return true;
  };
  DB.cambiarHora = function (id, h, actor) {
    const c = DB.cla.find(x => x.id === id); if (!c || c.est === 'hecha' || DB.hora(c) === h) return 'nada';
    if (DB.clasesDia(c.g, c.f).some(x => x.id !== id && DB.hora(x) === h)) return 'hora';
    const de = DB.hora(c); DB.upsert('cla', Object.assign({}, c, { h }), true);
    DB.registrar(actor, 'horario', { clase: id, de, a: h, txt: `Horario cambiado de ${de} a ${h}` }); DB.guardar(); return 'ok';
  };
  DB.suspender = function (id, nota, actor) {
    const c = DB.cla.find(x => x.id === id); if (!c || c.est !== 'plan') return;
    const sig = DB.clasesGrupo(c.g).filter(x => DB.clave(x) >= DB.clave(c) && x.est === 'plan');
    const ruts = sig.map(x => x.rut);
    sig.forEach((x, i) => { if (i === 0) DB.upsert('cla', Object.assign({}, x, { est: 'susp', nota: nota || 'Suspendida' }), true); else DB.upsert('cla', Object.assign({}, x, { rut: ruts[i - 1] }), true); });
    DB.registrar(actor, 'suspension', { clase: id, motivo: nota, txt: `Clase suspendida (${nota}); el plan se corrió una clase` });
    DB.guardar();
  };
  DB.reactivar = function (id, actor) {
    const c = DB.cla.find(x => x.id === id); if (!c || c.est !== 'susp') return;
    const sig = DB.clasesGrupo(c.g).filter(x => DB.clave(x) > DB.clave(c) && x.est === 'plan');
    DB.upsert('cla', Object.assign({}, c, { est: 'plan', nota: '', rut: sig.length ? sig[0].rut : c.rut }), true);
    sig.forEach((x, i) => DB.upsert('cla', Object.assign({}, x, { rut: sig[i + 1] ? sig[i + 1].rut : (C.grp[c.g].secuencia[(C.grp[c.g].secuencia.indexOf(x.rut) + 1) % C.grp[c.g].secuencia.length]) }), true));
    DB.registrar(actor, 'reactivacion', { clase: id, txt: 'Clase reactivada; el plan se corrió hacia atrás' });
    DB.guardar();

  DB.mover = function (id, f, actor, destino) {
    const c = DB.cla.find(x => x.id === id); if (!c || c.est !== 'plan') return 'nada';
    if (destino) {
      const d = DB.cla.find(x => x.id === destino); if (!d || d.id === c.id) return 'nada'; if (d.est !== 'plan') return 'hecha';
      DB.upsert('cla', Object.assign({}, d, { rut: c.rut }), true); DB.upsert('cla', Object.assign({}, c, { rut: d.rut }), true);

  DB.cambiarRutinaClase = function (id, rut, motivo, actor) {

  DB.guardarSecuencia = function (g, seq, actor) { DB.upsert('seq', { id: g, secuencia: seq.slice() }, true); DB.registrar(actor, 'secuencia', { txt: `Secuencia de ${C.grp[g].nombre}: ${seq.map(r => (C.rut[r] || {}).nombre).join(' → ')}` }); DB.replanificar(g, U.hoy()); };
  DB.replanificar = function (g, desde) {

    const hechas = todas.filter(x => x.est === 'hecha' && x.f < desde); const ult = hechas.length ? hechas[hechas.length - 1].rut : null;
    let i = ult && grp.secuencia.includes(ult) ? grp.secuencia.indexOf(ult) + 1 : 0;
    todas.filter(x => x.est === 'plan' && x.f >= desde).forEach(x => { DB.upsert('cla', Object.assign({}, x, { rut: grp.secuencia[i % grp.secuencia.length] }), true); i++; });
    DB.guardar();
  };

  /* ---------- asistencia → asistencia + sesión (snapshot) + series + niveles + auditoría ----------
     porAlumno[u] = { estado: presente|ausente|justificado, rut, motivo, items: [{ orden, base, ej, modf, tipo, obj, max, carga, rpe, series, real:[], kg, rpeReal, omitido, guardarNivel, origen }] } */
  const igual = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  DB.guardarAsistencia = function (claseId, porAlumno, actor) {
    if (!DB.cla.find(x => x.id === claseId) || DB.cla.find(x => x.id === claseId).f > U.hoy()) return 'futura'; // solo clases de hoy o pasadas
    const c = DB.cla.find(x => x.id === claseId), g = C.grp[c.g]; let pres = 0; const primera = c.est !== 'hecha'; const corregidas = {};
    const CAMPOS = { ej: 'ejercicio', modf: 'modificador', obj: 'objetivo', max: 'máximo', cargaObj: 'carga plan', rpeObj: 'RPE plan', reps: 'reps', seg: 'segundos', kg: 'kg', rpe: 'RPE real' };
    const nomSerie = x => `${(C.ej[x.base] || {}).nombre || x.base} S${x.n}`;
    const anota = (a, x, campos) => (corregidas[a] = corregidas[a] || []).push({ serie: x.id, nombre: nomSerie(x), campos });
    const lista = DB.alumnosClase(c).filter(a => porAlumno[a] && !(g.tipo === 'especial' && porAlumno[a].estado === 'pendiente' && !(DB.asiPorClase[claseId] || {})[a]));
    lista.forEach(a => {
      const d = porAlumno[a], sid = 'c-' + claseId + '-' + a;
      const prevAsi = (DB.asiPorClase[claseId] || {})[a], prevSes = DB.ses.find(s => s.id === sid && !s.bor);
      const asiN = { id: claseId + '|' + a, clase: claseId, g: g.id, u: a, f: c.f, estado: d.estado, rutPlan: c.rut, rut: d.estado === 'presente' ? d.rut : '', motivo: d.motivo || '', por: actor };
      if (!prevAsi || ['estado', 'rut', 'motivo'].some(k => prevAsi[k] !== asiN[k])) {
        DB.upsert('asi', asiN, true);
        if (prevAsi && prevAsi.estado !== asiN.estado) DB.registrar(actor, 'asistencia', { clase: claseId, u: a, de: prevAsi.estado, a: asiN.estado, txt: `Asistencia corregida: ${prevAsi.estado} → ${asiN.estado}` });
      }
      if (d.estado !== 'presente') {
        if (prevSes) {
          DB.upsert('ses', Object.assign({}, prevSes, { bor: 1 }), true);
          (DB.serPorSes[sid] || []).forEach(x => { DB.upsert('ser', Object.assign({}, x, { bor: 1 }), true); anota(a, x, [{ campo: 'serie', antes: `${x.reps || x.seg}${x.seg ? ' s' : ' reps'}${x.kg ? ' · ' + x.kg + ' kg' : ''}${x.rpe ? ' · RPE ' + x.rpe : ''}`, despues: 'quitada (pasó a ' + d.estado + ')' }]); });
        }
        return;
      }
      pres++;
      const R = C.rut[d.rut] || {}, snap = d.snap || snapItems(R);
      const sesN = { id: sid, clase: claseId, u: a, f: c.f, ini: g.hora, rutPlan: c.rut, rut: d.rut, rutNombre: d.rutNombre || R.nombre, motivo: d.motivo || '', items: snap, por: actor, bor: 0 };
      if (!prevSes || ['rut', 'motivo', 'rutNombre'].some(k => prevSes[k] !== sesN[k]) || !igual(prevSes.items, sesN.items)) DB.upsert('ses', sesN, true);
      if ((prevSes ? prevSes.rut : c.rut) !== d.rut) DB.registrar(actor, 'rutina_alumno', { clase: claseId, u: a, de: prevSes ? prevSes.rut : c.rut, a: d.rut, motivo: d.motivo });
      const nuevas = {};
      d.items.forEach(p => {
        if (p.omitido) return;
        const e = C.ejEn(p.ej, c.f);
        const cambio = p.ej !== p.planEj || p.modf !== p.planModf || p.obj !== p.planObj || (+p.carga || 0) !== (+p.planCarga || 0) || (+p.rpe || 0) !== (+p.planRpe || 0);
        for (let k = 1; k <= p.series; k++) {
          const r = p.real[k - 1];
          let v = r !== '' && r !== undefined && r !== null ? +r : (p.tipo === 'fallo' ? 0 : p.obj);
          if (!v) continue;
          const kg = p.kg !== '' && p.kg !== undefined ? +p.kg || 0 : +p.carga || 0;
          const fuera = r !== '' && r !== undefined && p.tipo !== 'fallo' && (p.tipo === 'rango' ? (+r < p.obj || +r > p.max) : +r !== p.obj);
          const origen = cambio || (fuera && !(p.origenes && p.origenes[k - 1] && p.realOrig && p.realOrig[k - 1] === r)) ? 'dia' : (p.origenes && p.origenes[k - 1]) || (fuera ? 'dia' : p.origen);
          const rpeR = Array.isArray(p.rpeReal) ? +p.rpeReal[k - 1] || 0 : +p.rpeReal || 0;
          const o = { id: sid + '-' + p.orden + '-' + k, s: sid, u: a, f: c.f, orden: p.orden, n: k, base: p.base, ej: p.ej, modf: p.modf, tipo: p.tipo, obj: p.obj, max: p.max, cargaObj: +p.carga || 0, rpeObj: +p.rpe || 0, origen, reps: e.medida === 'reps' ? v : 0, seg: e.medida === 'tiempo' ? v : 0, kg, rpe: rpeR, bor: 0, nom: e.nombre, pat: e.patron, med: e.medida, mp: e.principal, ms: (e.secundarios || []).slice() };
          nuevas[o.id] = o;
          const ant = DB.ser.find(x => x.id === o.id && !x.bor);
          if (!ant || ['ej', 'base', 'modf', 'tipo', 'obj', 'max', 'cargaObj', 'rpeObj', 'origen', 'reps', 'seg', 'kg', 'rpe'].some(kk => (ant[kk] || 0) !== (o[kk] || 0))) {
            DB.upsert('ser', o, true);
            if (prevSes) anota(a, o, ant ? Object.keys(CAMPOS).filter(kk => (ant[kk] || 0) !== (o[kk] || 0)).map(kk => ({ campo: CAMPOS[kk], antes: ant[kk] || 0, despues: o[kk] || 0 })) : [{ campo: 'serie', antes: 'no estaba', despues: 'agregada' }]);
          }
        }
        if (p.guardarNivel && cambio) {
          const nv = { id: a + '|' + p.base + '|' + c.f + '|' + U.uid(), u: a, base: p.base, v: p.ej, modf: p.modf, obj: p.tipo === 'fallo' ? 0 : p.obj, carga: +p.carga || 0, rpe: +p.rpe || 0, desde: c.f, por: actor };
          DB.upsert('niv', nv, true);
          DB.registrar(actor, 'nivel', { clase: claseId, u: a, txt: `Nuevo nivel en ${C.ej[p.base].nombre}: ${C.ej[p.ej].nombre}${p.modf ? ' · ' + p.modf : ''}${p.tipo !== 'fallo' ? ' · objetivo ' + p.obj : ''}${+p.carga ? ' · ' + p.carga + ' kg' : ''}${+p.rpe ? ' · RPE ' + p.rpe : ''}` });
        }
      });
      (DB.serPorSes[sid] || []).forEach(x => { if (!nuevas[x.id]) { DB.upsert('ser', Object.assign({}, x, { bor: 1 }), true); if (prevSes) anota(a, x, [{ campo: 'serie', antes: `${x.reps || x.seg}${x.seg ? ' s' : ' reps'}`, despues: 'eliminada' }]); } });
    });
    Object.entries(corregidas).forEach(([a, det]) => { const quit = det.length && det.every(x => String(x.campos[0].despues).startsWith('quitada')); DB.registrar(actor, 'correccion', { clase: claseId, u: a, detalle: det, txt: quit ? `${det.length} ${det.length === 1 ? 'serie quitada' : 'series quitadas'} (pasó a ${porAlumno[a].estado})` : `${det.length} ${det.length === 1 ? 'serie corregida' : 'series corregidas'} después de tomada la asistencia` }); });
    if (primera) { DB.upsert('cla', Object.assign({}, c, { est: 'hecha', snap: { nombre: (C.rut[c.rut] || {}).nombre, items: snapItems(C.rut[c.rut] || { items: [] }) } }), true); DB.registrar(actor, 'asistencia', { clase: claseId, txt: g.tipo === 'especial' ? `Clase especial: ${pres} participantes` : `Asistencia tomada: ${pres} de ${lista.length} presentes` }); }
    DB.guardar();
  };
  window.DB = DB;
})();

/* ===== Cálculos (mismo motor que usará el ETL del conversor) ===== */
(function () {
  const C = window.CATALOGO, DB = window.DB, U = window.U;
  const K = {};

  K.sesiones = u => DB.ses.filter(s => s.u === u && !s.bor);
  K.series = u => { const ids = new Set(K.sesiones(u).map(s => s.id)); return DB.ser.filter(x => x.u === u && !x.bor && ids.has(x.s)); };
  K.valor = x => x.reps || x.seg || 0;

  /* semanas: reps, series, días */
  K.semanas = function (u, n) {
    const hoy = U.hoy(), out = [];
    let lun = U.lunes(hoy);
    for (let i = n - 1; i >= 0; i--) out.push({ sem: U.sumDias(lun, -7 * i), reps: 0, seg: 0, series: 0, dias: new Set() });
    const idx = {}; out.forEach((w, i) => idx[w.sem] = i);
    K.series(u).forEach(x => { const i = idx[U.lunes(x.f)]; if (i === undefined) return; const w = out[i]; w.reps += x.reps; w.seg += x.seg; w.series++; w.dias.add(x.f); });
    out.forEach(w => w.dias = w.dias.size);
    return out;
  };

  K.rachaSemanal = function (u) {
    const obj = (C.usr[u] || {}).dias_obj || 3;
    const sem = K.semanas(u, 60); let r = 0;
    for (let i = sem.length - 1; i >= 0; i--) {
      if (sem[i].dias >= obj) r++;
      else if (i === sem.length - 1) continue; // semana en curso: todavía no corta la racha
      else break;
    }
    return r;
  };
  K.rachaDias = function (u) {
    const dias = new Set(K.sesiones(u).map(s => s.f));
    let d = U.hoy(); if (!dias.has(d)) d = U.sumDias(d, -1);
    let r = 0; while (dias.has(d)) { r++; d = U.sumDias(d, -1); }
    return r;
  };
  K.ultimaSesion = u => { const s = K.sesiones(u); return s.length ? s[s.length - 1] : null; };

  /* músculos: series ponderadas (principal 1, secundario 0,5) y último estímulo */
  K.musculos = function (u, dias) {
    const desde = U.sumDias(U.hoy(), -dias + 1), res = {};
    C.MUSCULOS.forEach(m => res[m.id] = { id: m.id, vol: 0, ultimo: null });
    K.series(u).forEach(x => {
      const e = C.ejSerie(x); if (!e) return;
      const marca = (id, w) => { const r = res[id]; if (!r) return; if (x.f >= desde) r.vol += w; if (!r.ultimo || x.f > r.ultimo) r.ultimo = x.f; };
      marca(e.principal, 1); e.secundarios.forEach(s => marca(s, 0.5));
    });
    Object.values(res).forEach(r => {
      const m = C.mus[r.id];
      r.desde = r.ultimo ? U.difDias(U.hoy(), r.ultimo) : null;
      r.estado = r.desde === null ? 'sin' : r.desde <= m.dias_obj ? 'ok' : r.desde <= m.dias_obj * 1.6 ? 'aten' : 'desc';
    });
    return res;
  };
  K.balance = function (u, dias) {
    const desde = U.sumDias(U.hoy(), -dias + 1), b = { Empuje: 0, 'Tracción': 0, Piernas: 0, Core: 0, Skill: 0 };
    K.series(u).forEach(x => { const e = C.ejSerie(x); if (x.f >= desde && e && b[e.patron] !== undefined) b[e.patron]++; });
    return b;
  };

  /* progreso por ejercicio */
  K.ejerciciosUsados = function (u) {
    const c = {}; K.series(u).forEach(x => c[x.ej] = (c[x.ej] || 0) + 1);
    return Object.keys(c).sort((a, b) => c[b] - c[a]);
  };
  K.historiaEj = function (u, ej) {
    const m = {};
    K.series(u).filter(x => x.ej === ej && (C.ejSerie(x).medida === (C.ej[ej] || {}).medida)).forEach(x => {
      const r = m[x.s] = m[x.s] || { f: x.f, s: x.s, mejor: 0, total: 0, kg: 0, series: [] };
      r.mejor = Math.max(r.mejor, K.valor(x)); r.total += K.valor(x); r.kg = Math.max(r.kg, x.kg); r.series.push(K.valor(x));
    });
    return Object.values(m).sort((a, b) => a.f.localeCompare(b.f));
  };
  K.records = function (u, ej, hasta) { // hasta: excluye sesiones posteriores (para detectar récords nuevos)
    const h = K.historiaEj(u, ej).filter(r => !hasta || r.s !== hasta);
    const rec = { mejor: null, total: null, kg: null };
    h.forEach(r => {
      if (!rec.mejor || r.mejor > rec.mejor.v) rec.mejor = { v: r.mejor, f: r.f };
      if (!rec.total || r.total > rec.total.v) rec.total = { v: r.total, f: r.f };
      if (r.kg && (!rec.kg || r.kg > rec.kg.v)) rec.kg = { v: r.kg, f: r.f };
    });
    return rec;
  };
  K.recordsMes = function (u) { // cantidad de récords (mejor serie) logrados en los últimos 30 días
    const desde = U.sumDias(U.hoy(), -29); let n = 0;
    K.ejerciciosUsados(u).forEach(ej => {
      let max = 0; K.historiaEj(u, ej).forEach((r, i) => { if (r.mejor > max) { if (i > 0 && r.f >= desde) n++; max = r.mejor; } });
    });
    return n;
  };
  K.ultimaVez = function (u, ej, excluir) {
    const h = K.historiaEj(u, ej).filter(r => r.s !== excluir); return h.length ? h[h.length - 1] : null;
  };
  /* ¿la mejor serie de este ejercicio en esta sesión superó todas las sesiones anteriores? */
  K.esRecord = function (u, ej, sid) {
    const ses = DB.ses.find(x => x.id === sid); if (!ses) return false;
    const h = K.historiaEj(u, ej), act = h.find(r => r.s === sid); if (!act) return false;
    const antes = h.filter(r => r.f < ses.f); return antes.length > 0 && act.mejor > Math.max(...antes.map(r => r.mejor));
  };
  K.fmt = (v, ej) => C.ej[ej] && C.ej[ej].medida === 'tiempo' ? v + ' s' : String(v);

  /* clases y asistencia */
  K.asistencia = function (u, dias) {
    const g = (C.usr[u] || {}).grupo; if (!g) return { pres: 0, aus: 0, just: 0, total: 0, pct: 0 };
    const desde = U.sumDias(U.hoy(), -dias + 1);
    const cl = DB.cla.filter(c => c.g === g && c.est === 'hecha' && c.f >= desde && c.f <= U.hoy());
    const est = cl.map(c => ((DB.asiPorClase[c.id] || {})[u] || {}).estado);
    const pres = est.filter(e => e === 'presente').length, just = est.filter(e => e === 'justificado').length;
    return { pres, just, aus: cl.length - pres - just, total: cl.length, pct: cl.length ? Math.round(pres / cl.length * 100) : 0 };
  };
  K.proximaClase = function (u) { const g = (C.usr[u] || {}).grupo; return DB.cla.find(c => c.g === g && c.est === 'plan' && c.f >= U.hoy()) || null; };
  K.musculosSesion = function (sid) { const m = {}; (DB.serPorSes[sid] || []).forEach(x => { const e = C.ejSerie(x); if (!e) return; m[e.principal] = 2; e.secundarios.forEach(s => { if (!m[s]) m[s] = 1; }); }); return m; };
  /* desglose muscular de una sesión: series ponderadas (principal ×1, secundario ×0,5), reps y ejercicios que aportan, agrupado por zona */
  K.desgloseSesion = function (sid) {
    const m = {};
    (DB.serPorSes[sid] || []).forEach(x => {
      const e = C.ejSerie(x); if (!e) return;
      const suma = (id, w, rol) => { const r = m[id] = m[id] || { id, vol: 0, reps: 0, seg: 0, rol, ejsP: new Set(), ejsS: new Set() }; r.vol += w; r.reps += x.reps * w; r.seg += x.seg * w; (rol === 'principal' ? r.ejsP : r.ejsS).add(e.nombre); if (rol === 'principal') r.rol = 'principal'; };
      suma(e.principal, 1, 'principal'); e.secundarios.forEach(s2 => suma(s2, 0.5, 'secundario'));
    });
    const lista = Object.values(m).map(r => Object.assign(r, { ejsP: [...r.ejsP], ejsS: [...r.ejsS], grupo: C.mus[r.id].grupo })).sort((a, b) => b.vol - a.vol);
    const total = lista.reduce((a, r) => a + r.vol, 0) || 1;
    lista.forEach(r => r.pct = Math.round(r.vol / total * 100));
    const zonas = ['Tren superior', 'Core', 'Tren inferior'].map(z => ({ zona: z, vol: lista.filter(r => r.grupo === z).reduce((a, r) => a + r.vol, 0), musculos: lista.filter(r => r.grupo === z) })).map(z => Object.assign(z, { pct: Math.round(z.vol / total * 100) }));
    return { lista, zonas, total };
  };
  window.K = K;
})();

/* ---- gamificacion.js ---- */
/* ===== Gamificación (v2.0): eventos → puntos → logros → ranking =====
   Funciones puras sobre los datos ya registrados (asistencia, series, niveles). No guardan nada ni dependen de la UI:
   el conversor (ETL) puede ejecutar el mismo código para publicar un ranking consolidado.
   Reglas, logros, temporadas y la activación viven en el Excel base (REGLAS_PUNTOS, LOGROS, TEMPORADAS, CONFIG). */
(function () {
  const C = window.CATALOGO, DB = window.DB, K = window.K, U = window.U;
  const GAM = {};

  GAM.activo = () => !!(C.CONFIG && C.CONFIG.ranking_activo);
  GAM.temporada = f => (C.TEMPORADAS || []).find(t => t.desde <= (f || U.hoy()) && (f || U.hoy()) <= t.hasta) || null;
  const regla = ev => (C.REGLAS_PUNTOS || []).find(r => r.evento === ev);

  /* eventos de un alumno: [{ evento, f, ref, detalle }] ordenados por fecha */
  GAM.eventos = function (u) {
    const ev = [], g = C.grp[(C.usr[u] || {}).grupo];
    // asistencia
    DB.asi.filter(a => a.u === u && !a.bor && a.estado === 'presente').forEach(a => ev.push({ evento: 'asistencia', f: a.f, ref: a.clase, detalle: 'Clase asistida' }));
    // objetivo cumplido: todas las series con objetivo numérico alcanzado
    K.sesiones(u).forEach(s => {
      const xs = (DB.serPorSes[s.id] || []).filter(x => x.tipo !== 'fallo');
      if (xs.length && xs.every(x => K.valor(x) >= x.obj)) ev.push({ evento: 'objetivo_cumplido', f: s.f, ref: s.id, detalle: s.rutNombre });
    });
    // récords: cada vez que la mejor serie de un ejercicio supera todas las anteriores
    K.ejerciciosUsados(u).forEach(ej => { let max = 0; K.historiaEj(u, ej).forEach((r, i) => { if (r.mejor > max) { if (i > 0) ev.push({ evento: 'record', f: r.f, ref: r.s, detalle: C.ej[ej].nombre + ' · ' + r.mejor }); max = r.mejor; } }); });
    // subida de nivel: el nivel nuevo usa una variante más difícil de la misma escalera
    const porBase = {};
    DB.nivHist.filter(n => n.u === u && !n.bor).forEach(n => {
      const prev = porBase[n.base];
      if (prev) { const vs = C.variantes(n.base), rel = id => (vs.find(v => v.id === id) || { rel: 0 }).rel; if (rel(n.v) > rel(prev.v)) ev.push({ evento: 'subida_nivel', f: n.desde, ref: n.id, detalle: C.ej[n.v].nombre }); }
      porBase[n.base] = n;
    });
    // semana completa: asistió a todas las clases dadas de su grupo en la semana
    if (g) {
      const sem = {};
      DB.cla.filter(c => c.g === g.id && c.est === 'hecha').forEach(c => { const w = U.lunes(c.f), s = sem[w] = sem[w] || { dadas: 0, pres: 0 }; s.dadas++; if (((DB.asiPorClase[c.id] || {})[u] || {}).estado === 'presente') s.pres++; });
      Object.entries(sem).forEach(([w, s]) => { if (s.dadas && s.pres === s.dadas && U.sumDias(w, 6) < U.hoy()) ev.push({ evento: 'semana_completa', f: U.sumDias(w, 6), ref: w, detalle: 'Semana del ' + w }); });
    }
    return ev.sort((a, b) => a.f.localeCompare(b.f));
  };

  /* puntos dentro de un período, aplicando el tope semanal de cada regla */
  GAM.puntos = function (u, desde, hasta) {
    const usados = {}; let total = 0; const detalle = [];
    GAM.eventos(u).filter(e => (!desde || e.f >= desde) && (!hasta || e.f <= hasta)).forEach(e => {
      const r = regla(e.evento); if (!r) return;
      const k = e.evento + '|' + U.lunes(e.f); usados[k] = (usados[k] || 0) + 1;
      if (r.tope && usados[k] > r.tope) return;
      total += r.puntos; detalle.push(Object.assign({ puntos: r.puntos }, e));
    });
    return { total, detalle };
  };

  GAM.logros = function (u) {
    const ev = GAM.eventos(u);
    return (C.LOGROS || []).map(l => { const n = ev.filter(e => e.evento === l.evento).length; return Object.assign({ progreso: Math.min(n, l.cantidad), logrado: n >= l.cantidad }, l); });
  };

  /* ranking por alcance: 'grupo' (id de grupo), 'profesor' (usuario), 'global'. Respeta el consentimiento (USUARIOS.ranking) */
  GAM.ranking = function (alcance, ref, temporada) {
    const t = temporada || GAM.temporada();
    let alumnos = C.USUARIOS.filter(x => x.rol === 'alumno' && x.activo);
    if (alcance === 'grupo') alumnos = alumnos.filter(x => x.grupo === ref);
    if (alcance === 'profesor') alumnos = alumnos.filter(x => x.profesor === ref);
    const fuera = alumnos.filter(x => !x.ranking).length;
    const filas = alumnos.filter(x => x.ranking).map(x => ({ u: x.usuario, puntos: GAM.puntos(x.usuario, t && t.desde, t && t.hasta).total })).sort((a, b) => b.puntos - a.puntos);
    filas.forEach((r, i) => r.pos = i > 0 && r.puntos === filas[i - 1].puntos ? filas[i - 1].pos : i + 1);
    return { temporada: t, filas, fuera };
  };
  /* cierre de temporada: congela posiciones y puntos en la colección "pts" para que el ranking histórico no cambie
     aunque después se corrijan asistencias o se editen reglas */
  GAM.congelar = function (temporada, actor) {
    C.GRUPOS.forEach(g => GAM.ranking('grupo', g.id, temporada).filas.forEach(f => DB.upsert('pts', { id: temporada.id + '|' + f.u, temporada: temporada.id, g: g.id, u: f.u, puntos: f.puntos, pos: f.pos, por: actor }, true)));
    DB.registrar(actor, 'temporada', { txt: `Temporada ${temporada.nombre} cerrada y congelada` }); DB.guardar();
  };
  GAM.rankingCongelado = (temporadaId, g) => DB.pts.filter(x => x.temporada === temporadaId && (!g || x.g === g)).sort((a, b) => a.pos - b.pos);
  window.GAM = GAM;
})();

/* ===== Gráficos SVG (sin librerías) ===== */
(function () {
  const G = {};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  G.esc = esc;

  /* tooltip global: cualquier elemento con data-tt */
  let tt;
  G.initTooltip = function () {
    tt = document.createElement('div'); tt.className = 'tt'; document.body.appendChild(tt);
    const show = e => {
      const el = e.target.closest('[data-tt]'); if (!el) { tt.style.display = 'none'; return; }
      tt.innerHTML = el.getAttribute('data-tt'); tt.style.display = 'block';
      const x = (e.touches ? e.touches[0].clientX : e.clientX), y = (e.touches ? e.touches[0].clientY : e.clientY);
      const w = tt.offsetWidth; tt.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px'; tt.style.top = (y - 44) + 'px';
    };
    document.addEventListener('mousemove', show); document.addEventListener('touchstart', show, { passive: true });
    document.addEventListener('scroll', () => tt.style.display = 'none', true);
  };

  function niceMax(v) { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  /* barras en capas (estilo Activity): datos [{x, v, prev, actual, tt}] */
  G.barras = function (datos, o) {
    o = o || {}; const W = 340, H = o.h || 210, pb = 26, pt = 8;
    const max = Math.max(1, ...datos.map(d => Math.max(d.v, d.prev || 0))) * 1.15;
    const bw = W / datos.length, w = Math.min(46, bw * 0.78), r = Math.min(14, w / 2);
    const bar = (x, h, col) => h <= 0 ? '' : `<path d="M${x},${H - pb} V${H - pb - h + Math.min(r, h)} q0,-${Math.min(r, h)} ${w / 2},-${Math.min(r, h)} q${w / 2},0 ${w / 2},${Math.min(r, h)} V${H - pb} Z" fill="${col}"/>`;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titulo || '')}">`;
    datos.forEach((d, i) => {
      const x = i * bw + (bw - w) / 2, hh = H - pb - pt;
      s += bar(x, hh, '#F1F0F3');
      if (d.prev) s += bar(x, hh * d.prev / max, 'var(--bar-s)');
      s += bar(x, hh * d.v / max, d.actual ? 'var(--bar)' : 'var(--bar-m)');
      if (d.lbl) s += `<text class="lbl" x="${x + w / 2}" y="${H - pb - hh * d.v / max - 6}" text-anchor="middle">${d.lbl}</text>`;
      s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" class="${d.actual ? 'xact' : ''}">${esc(d.x)}</text>`;
      s += `<rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-tt="${esc(d.tt || d.v)}"/>`;
    });
    return s + '</svg>';
  };

  /* barras diarias finas (ancho total = n/visibles del contenedor, se desplaza) */
  G.barrasDias = function (datos, o) {
    o = o || {}; const vis = o.visibles || 14, Wv = 340, W = Wv * datos.length / vis, H = o.h || 220, pb = 34, pt = 22;
    const max = Math.max(1, ...datos.map(d => Math.max(d.v, d.prev || 0))) * 1.12;
    const bw = W / datos.length, w = Math.min(14, bw * 0.46), r = w / 2, hh = H - pb - pt;
    const bar = (x, h, col) => h <= 0 ? '' : `<path d="M${x},${H - pb} V${H - pb - h + Math.min(r, h)} a${r},${Math.min(r, h)} 0 0 1 ${w},0 V${H - pb} Z" fill="${col}"/>`;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:${100 * datos.length / vis}%;height:auto" role="img" aria-label="${esc(o.titulo || '')}">`;
    datos.forEach((d, i) => {
      const x = i * bw + (bw - w) / 2;
      if (d.lunes) s += `<line x1="${i * bw}" x2="${i * bw}" y1="4" y2="${H - 4}" stroke="#E3E5E9" stroke-dasharray="3 3"/><text x="${i * bw + 4}" y="12" style="font-size:10px;font-weight:600">${esc(d.semana)}</text>`;
      s += bar(x, hh, '#F1F0F3');
      if (d.prev) s += bar(x, hh * d.prev / max, 'var(--bar-s)');
      if (d.v) s += bar(x, hh * d.v / max, d.actual ? 'var(--bar)' : d.futuro ? '#F1F0F3' : 'var(--bar-m)');
      s += `<text x="${x + w / 2}" y="${H - 18}" text-anchor="middle" class="${d.actual ? 'xact' : ''}">${esc(d.x)}</text><text x="${x + w / 2}" y="${H - 4}" text-anchor="middle" style="font-size:9px" class="${d.actual ? 'xact' : ''}">${esc(d.n)}</text>`;
      s += `<rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-tt="${esc(d.tt || d.v)}"/>`;
    });
    return s + '</svg>';
  };

  /* línea: datos [{v, tt, x}] + récord (línea punteada) */
  G.linea = function (datos, o) {
    o = o || {}; const W = 340, H = o.h || 160, pl = 30, pr = 10, pb = 20, pt = 16;
    if (!datos.length) return '<div class="vacio">Sin registros todavía</div>';
    const vals = datos.map(d => d.v); const max = niceMax(Math.max(...vals) * 1.1), min = 0;
    const X = i => pl + (datos.length === 1 ? (W - pl - pr) / 2 : (W - pl - pr) * i / (datos.length - 1));
    const Y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));

    if (o.record) { const y = Y(o.record); s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="4 4"/><text x="${W - pr}" y="${y - 5}" text-anchor="end" class="lbl">Récord ${o.recordTxt || o.record}</text>`; }
    const pts = datos.map((d, i) => `${X(i)},${Y(d.v)}`);
    s += `<path d="M${pts.join(' L')} L${X(datos.length - 1)},${H - pb} L${X(0)},${H - pb} Z" fill="var(--cy)" opacity=".10"/>`;
    s += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--cy)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    datos.forEach((d, i) => {
      if (d.rec || i === datos.length - 1) s += `<circle cx="${X(i)}" cy="${Y(d.v)}" r="${d.rec ? 4.5 : 4}" fill="${d.rec ? 'var(--or)' : 'var(--cy)'}" stroke="var(--card)" stroke-width="2"/>`;
    });
    // etiquetas de eje x: primera, media y última
    [0, Math.floor((datos.length - 1) / 2), datos.length - 1].filter((v, i, a) => a.indexOf(v) === i).forEach(i => s += `<text x="${X(i)}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === datos.length - 1 ? 'end' : 'middle'}">${esc(datos[i].x)}</text>`);
    const bw = (W - pl - pr) / Math.max(1, datos.length - 1);
    datos.forEach((d, i) => s += `<rect x="${X(i) - bw / 2}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent" data-tt="${esc(d.tt)}"/>`);
    return s + '</svg>';
  };

  /* ===== silueta anatómica (estilo lámina: músculos pizarra, resaltado coral) =====
     modo 'vol': color por volumen (pizarra = sin estímulo, rampa coral = menos→más)

  G.PIZARRA = '#6F8499'; G.SIN_SEG = '#B4C0CC';

  G.cuerpo = function (cara, o) {
    const B = window.CUERPO[cara], C = window.CATALOGO; o = o || {};
    let s = `<svg class="cuerpo ${o.mini ? 'mini' : ''}" viewBox="${B.vb}" role="img" aria-label="Cuerpo, ${cara}">`;
    B.m.forEach(([id, d]) => {

      else if (o.modo === 'mapa') { const v = o.mapa[id] || 0; col = v === 2 ? '#EE5F5F' : v === 1 ? '#F5ABA5' : G.PIZARRA; tt = `<b>${m.nombre}</b>` + (v === 2 ? ' · principal' : v === 1 ? ' · secundario' : ' · no trabajado'); }
      else if (o.modo === 'ej') { col = id === o.principal ? '#EE5F5F' : (o.secundarios || []).includes(id) ? '#F5ABA5' : G.PIZARRA; tt = `<b>${m.nombre}</b>` + (id === o.principal ? ' · principal' : (o.secundarios || []).includes(id) ? ' · secundario' : ''); }
      else { const r = o.res[id]; col = o.modo === 'sel' ? (id === o.sel ? '#EE5F5F' : G.PIZARRA) : G.escala[G.nivel(r.vol, o.dias)]; tt = `<b>${m.nombre}</b> · ${(Math.round(r.vol * 10) / 10).toString().replace('.', ',')} series` + (r.desde !== null ? ` · hace ${r.desde} d` : ' · sin registro'); }
      const sel = o.sel === id && o.modo !== 'sel' ? ' sel' : '';
      s += `<path class="m${sel}" d="${d}" fill="${col}" ${o.mini ? '' : `data-tt="${esc(tt)}" ${m ? `data-mus="${id}"` : ''}`}/>`;
    });
    s += `<path d="${B.out}" fill="none" stroke="#9AA6B2" stroke-width="2" vector-effect="non-scaling-stroke"/>`;

    // otros
    if (d.rango) { S.rango = +d.rango; guardar(); pintarTab(true); return; }
    if (d.ses) return detalleSesion(d.ses);
    if (d.prof) { S.filtroProf = d.prof; guardar(); pintarTab(true); return; }
    if (d.alumno) { S.ver = d.alumno; S.tab = 'progreso'; S.subP = 'resumen'; guardar(); render(); return; }
  });
  document.addEventListener('change', e => {
    const t = e.target, d = t.dataset;
    if (t.id === 'selVer') { S.ver = t.value; guardar(); render(); return; }
    if (t.id === 'selEj') { S.ejSel = t.value; pintarTab(true); return; }
    const c = S.tab === 'clase' && S.claseSel && DB.cla.find(x => x.id === S.claseSel); if (!c) return;
    const b = borrador(c);
    if (d.rutAlu) { const x = b[d.rutAlu]; x.rut = t.value; x.items = itemsAlumno(d.rutAlu, t.value, c.f); x.snap = null; x.rutNombre = ''; if (t.value === c.rut) x.motivo = ''; pintarTab(true); return; }
    if (d.motivoAlu) { b[d.motivoAlu].motivo = t.value; pintarTab(true); return; }
    if (d.guardarNivel) { const [a, k] = d.guardarNivel.split('|'); b[a].items[+k].guardarNivel = t.checked; return; }
    if (d.aj) { const [a, k, campo] = d.aj.split('|'); const p = b[a].items[+k], val = String(t.value).replace(',', '.'); if (campo === 'obj') { p.obj = +val || p.obj; if (p.tipo === 'rango') p.max = p.obj + Math.max(0, (p.planMax || p.max) - p.planObj); } else if (campo === 'carga' || campo === 'rpe') p[campo] = +val || 0; else if (campo === 'kg') p.kg = val === '' ? '' : +val; else if (campo === 'rpeReal') { if (val !== 'keep') p.rpeReal = Array.from({ length: p.series }, () => val === '' ? '' : +val); } else p[campo] = t.value; pintarTab(true); return; }
    if (d.real) { const [a, k, s2] = d.real.split('|'); b[a].items[+k].real[+s2] = t.value !== '' ? +t.value : ''; pintarTab(true); return; }
    if (d.omit) { const [a, k] = d.omit.split('|'); b[a].items[+k].omitido = t.checked; pintarTab(true); return; }
  });

  /* ================= INICIO ================= */
  DB.cargar();
  G.initTooltip();
  vistaLogin(); // siempre arranca con la animación de marca; Ingresar entra directo si ya hay sesión
})();

};</script>
